const categories=['Physical','Social','Combat','Science','Tech'];
const skills=Object.entries(raw).flatMap(([cat,s])=>s.split('\n').map(line=>{const [name,tier,desc]=line.split('|');return{id:name,cat,tier:Number(tier),desc}}));
const byId=Object.fromEntries(skills.map(s=>[s.id,s]));
const starters=['Piloting','Targeting Control Systems','Boost Pack Training'];
const DEFAULT=['Security','Persuasion','Ballistics','Weight Lifting','Security','Piloting','Ballistics','Security','Piloting','Shield Systems','Boost Pack Training','Persuasion','Piloting','Wellness','Ballistics','Medicine','Starship Design','Particle Beam Weapon Systems','Weight Lifting','Fitness','Shield Systems','Ballistics','Rifle Certification','Research Methods','Medicine','Surveying','Weapon Engineering','Starship Design','Boost Pack Training','Rifle Certification'];
const presets={

'Ship Specialist':['Security','Piloting','Boost Pack Training','Piloting','Shield Systems','Piloting','Targeting Control Systems','Piloting','Shield Systems','Payloads','Starship Design','Particle Beam Weapon Systems','Starship Design','Engine Systems','Shield Systems','Starship Engineering','Particle Beam Weapon Systems'],
'Ground Combat':['Ballistics','Security','Weight Lifting','Ballistics','Wellness','Ballistics','Fitness','Ballistics','Boost Pack Training','Rifle Certification','Wellness','Boost Pack Training','Rifle Certification','Medicine','Persuasion','Rifle Certification'],
'Social Explorer':['Persuasion','Security','Commerce','Weight Lifting','Persuasion','Scavenging','Persuasion','Piloting','Commerce','Wellness','Security','Piloting','Leadership','Persuasion','Medicine','Weight Lifting']};
const challenge={
'Security':['Pick 5 locks.','Pick 15 locks.','Pick 30 locks.'],
'Piloting':['Destroy 5 ships.','Destroy 15 ships.','Destroy 30 ships.'],
'Targeting Control Systems':['Destroy 5 enemy ships in targeting mode.','Destroy 15 enemy ships in targeting mode.','Destroy 30 enemy ships in targeting mode.'],
'Boost Pack Training':['Boost jump 10 times during combat.','Boost jump 25 times during combat.','Boost jump 50 times during combat.'],

'Weight Lifting':['Sprint 1,000m while carrying at least 75% of capacity.','Sprint 2,500m while carrying at least 75% of capacity.','Sprint 5,000m while carrying at least 75% of capacity.'],

'Security':['Hack Advanced locks.','Hack Expert locks.','Hack Master locks.','Remove unnecessary keys with a digipick.'],
'Ballistics':['+10% ballistic damage.','+20% ballistic damage.','+30% ballistic damage.','+30% ballistic range.'],
'Boost Pack Training':['Use boost packs.','Boosting expends less fuel.','Boost fuel regenerates faster.','Double previous bonuses.'],

'Weight Lifting':['+10 kg carry capacity.','+25 kg carry capacity.','+50 kg carry capacity.','+100 kg capacity; stagger resistance.'],
'Starship Design':['Improved ship modules.','Superior ship modules.','Cutting-edge ship modules.','Experimental ship modules.'],
'Rifle Certification':['+10% rifle damage.','+20% rifle damage.','+30% rifle damage.','Faster rifle reload while stationary.']};
function fresh(){return{version:2,name:'The Bounty Hunter',level:1,traits:['Wanted','Taskmaster','Kid Stuff'],ranks:Object.fromEntries(starters.map(n=>[n,1])),ready:{},plan:DEFAULT.slice(),notes:'',preset:'Bounty Hunter Captain'}}
const KEY='orbit-starfield-v1';
function sanitize(data){let x=fresh();if(!data||typeof data!=='object')return x;x.name=String(data.name??x.name).slice(0,70);x.traits=Array.isArray(data.traits)?data.traits.map(v=>String(v).slice(0,45)).slice(0,3):x.traits;x.level=Math.max(1,Math.min(999,Math.floor(Number(data.level)||1)));x.ranks={...x.ranks};if(data.ranks&&typeof data.ranks==='object')for(const [id,v]of Object.entries(data.ranks))if(byId[id])x.ranks[id]=Math.max(starters.includes(id)?1:0,Math.min(4,Math.floor(Number(v)||0)));x.ready={};if(data.ready&&typeof data.ready==='object')for(const [id,v]of Object.entries(data.ready))if(byId[id])x.ready[id]=Boolean(v);x.plan=Array.isArray(data.plan)?data.plan.filter(id=>typeof id==='string'&&byId[id]).slice(0,300):x.plan;x.notes=String(data.notes||'').slice(0,4000);x.preset=String(data.preset||x.preset).slice(0,60);x.level=Math.max(x.level,spent(x)+1);return x}
let state;try{state=sanitize(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh()}
let page='overview',filterCat='All',filterTier='All',filterQuery='',showOwned=false;let toastTimer;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}const s=document.getElementById('save-state');if(s)s.textContent='Saved on device'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function current(id){return state.ranks[id]||0}
function spent(s=state){return Object.entries(s.ranks||{}).reduce((n,[id,r])=>n+Math.max(0,Number(r)-(starters.includes(id)?1:0)),0)}
function points(){return state.level-1-spent()}
function catTotal(cat,ranks=state.ranks){return skills.reduce((sum,s)=>sum+(s.cat===cat?(ranks[s.id]||0):0),0)}
function tierNeed(skill){return (skill.tier-1)*4}
function tierGap(skill,ranks=state.ranks){return Math.max(0,tierNeed(skill)-catTotal(skill.cat,ranks))}
function challengeText(id,rank){return(challenge[id]&&challenge[id][rank-1])||'Complete the current rank challenge shown in Starfield.'}
function benefitText(id,rank){return(benefits[id]&&benefits[id][rank-1])||byId[id].desc}
function canBuy(id){const s=byId[id],r=current(id);if(!s||r>=4)return{ok:false,why:'Maximum rank reached'};if(points()<1)return{ok:false,why:'No skill points left. Increase your character level to earn another point.'};const gap=tierGap(s);if(gap)return{ok:false,why:`Need ${gap} more ${s.cat} rank${gap===1?'':'s'} to unlock Tier ${s.tier}`};if(r&&!state.ready[id])return{ok:false,why:`Complete the ${id} Rank ${r} challenge in Starfield and check it off here.`};return{ok:true,why:''}}
function toast(message,bad=false){const node=document.getElementById('toast');node.textContent=message;node.style.background=bad?'#42222d':'#17433e';node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),3100)}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}
function buy(id){const check=canBuy(id);if(!check.ok){toast(check.why,true);return}const next=current(id)+1;state.ranks[id]=next;state.ready[id]=false;let i=state.plan.indexOf(id);if(i>=0)state.plan.splice(i,1);persist();render();toast(`${id} → Rank ${next} unlocked`)}
function undo(id){if(current(id)<=(starters.includes(id)?1:0))return;const old=current(id);state.ranks[id]=old-1;state.ready[id]=false;persist();render();toast(`Reverted ${id} from Rank ${old} (planner only)`)}
function add(id){let count=state.plan.filter(x=>x===id).length;if(current(id)+count>=4){toast('Already at Rank 4 in your current build / queue.',true);return}state.plan.push(id);persist();render();toast(`Added ${id} to your roadmap`)}
function planSimulation(){const virtual={...state.ranks},counts=Object.fromEntries(categories.map(c=>[c,catTotal(c,virtual)]));const available=points();return state.plan.map((id,i)=>{const s=byId[id],r=virtual[id]||0;const next=r+1;const needed=tierNeed(s);const missing=Math.max(0,needed-counts[s.cat]);const maxed=next>4;const level=state.level+Math.max(0,i+1-available);if(!maxed){virtual[id]=next;counts[s.cat]+=1}return{id,rank:next,level,missing,maxed,index:i,skill:s}})}
function categoryClass(cat){return 'cat'+cat.toLowerCase()}
function categoryBadge(cat){return `<span class="chip ${categoryClass(cat)}">${cat}</span>`}
function hero(){const pct=Math.min(100,Math.round(spent()/Math.max(1,state.level-1)*100));return `<div class="hero"><div class="stat hero-primary"><div class="progressring" style="--pct:${pct}%"><span>${pct}%</span></div><div><div class="cap">Character level</div><div class="levelctrl"><button class="squarebtn" data-act="leveldown" aria-label="Level down">−</button><div class="num">${state.level}</div><button class="squarebtn" data-act="levelup" aria-label="Level up">+</button></div><div class="mut">${esc(state.name)}</div></div></div><div class="stat"><div class="cap">Unspent points</div><div class="num" style="color:var(--cyan);margin:9px 0 4px">${points()}</div><div class="mut">Available to allocate</div></div><div class="stat"><div class="cap">Planned upgrades</div><div class="num" style="margin:9px 0 4px">${state.plan.length}</div><div class="mut">Through ~level ${state.level+Math.max(0,state.plan.length-points())}</div></div></div>`}
function roadCard(p,detailed=false){
  const {id,rank,level,missing,maxed,index,skill}=p;
  const issues=[];
  if(missing)issues.push(`Tier ${skill.tier} needs ${missing} more ${skill.cat} ranks before this planned step`);
  if(maxed)issues.push('Already Rank 4 in this projected build');
  const owned=current(id), gate=canBuy(id), isNext=owned+1===rank;
  const canPurchase=!maxed&&isNext&&gate.ok;
  const blocker=maxed?'The planned build exceeds Rank 4':!isNext?`First purchase the earlier ${id} rank${owned+1} upgrade.`:gate.why;
  const challengeCheck=isNext&&owned>0&&owned<4?`<label class="checkboxline road-challenge"><input type="checkbox" data-challenge="${esc(id)}" ${state.ready[id]?'checked':''}><span><strong>${state.ready[id]?'Challenge completed':'Mark challenge complete'}</strong>: ${esc(challengeText(id,owned))}</span></label>`:'';
  return `<div class="roaditem"><div class="lvl"><small>${level===state.level?'NOW':'LEVEL'}</small>${level}</div><div><h4>${esc(id)} <span class="rankno">RANK ${Math.min(4,rank)}</span></h4><div class="duo">${categoryBadge(skill.cat)}<span class="chip">Tier ${skill.tier}</span></div>${issues.length?`<div class="hint">⚠ ${esc(issues.join(' · '))}</div>`:detailed?`<p>${esc(benefitText(id,Math.min(4,rank)))}</p>`:''}${challengeCheck}${!canPurchase?`<div class="action-status">🔒 ${esc(blocker)}</div>`:`<div class="action-status ready">✓ Ready to learn with one available point</div>`}</div><div class="actions">${detailed?`<button class="ghost" data-act="moveup" data-index="${index}" aria-label="Move earlier" title="Move earlier" ${index===0?'disabled':''}>↑</button><button class="ghost" data-act="movedown" data-index="${index}" aria-label="Move later" title="Move later" ${index===state.plan.length-1?'disabled':''}>↓</button>`:''}<button class="smallbtn ${canPurchase?'primary':'blocked-action'}" data-act="buy" data-id="${esc(id)}" data-target-rank="${rank}" title="${esc(blocker||'Learn this rank')}">${canPurchase?'Learn': 'Learn · locked'}</button>${detailed?`<button class="ghost" data-act="remove" data-index="${index}" title="Remove from plan" aria-label="Remove from plan">×</button>`:''}</div></div>`;
}
function milestones(){const goals=[{id:'Security',rank:3,title:'Master locks',detail:'Security Rank 3 opens Master locks.'},{id:'Piloting',rank:3,title:'Class B ships',detail:'Piloting Rank 3 unlocks Class B.'},{id:'Piloting',rank:4,title:'Class C ships',detail:'Piloting Rank 4 unlocks Class C.'},{id:'Starship Design',rank:1,title:'Advanced ship parts',detail:'Start installing improved modules.'},{id:'Weapon Engineering',rank:1,title:'Weapons workshop',detail:'Build more effective weapon mods.'}];const sim=planSimulation();return goals.map(g=>{const isHit=current(g.id)>=g.rank;const at=sim.find(t=>t.id===g.id&&t.rank===g.rank);return `<div class="milestone"><span class="dot ${isHit?'hit':''}"></span><div style="flex:1"><div class="row"><strong>${esc(g.title)}</strong><span class="chip">${isHit?'Unlocked':at?`Level ${at.level}`:'Not queued'}</span></div><p>${esc(g.detail)}</p></div></div>`}).join('')}
function categoryProgress(){return categories.map(cat=>{const count=catTotal(cat);const next=count<4?4:count<8?8:count<12?12:16;return `<div class="catrow"><div class="cathead"><span>${categoryBadge(cat)}</span><span>${count} ranks · ${count>=12?'All tiers open':`${Math.min(12,next)} for next tier`}</span></div><div class="bar"><span style="width:${Math.min(100,count/12*100)}%"></span></div></div>`}).join('')}
function overview(){const sim=planSimulation();const readyNow=sim.find(p=>current(p.id)+1===p.rank&&canBuy(p.id).ok);const allBlocked=points()>0&&!readyNow;return `<div class="headrow"><div><span class="eyebrow">Captain's console / 01</span><h2>Welcome back, Captain.</h2><p class="sub">Track your real skills. Plot the next ones.</p></div><span class="pill" id="save-state">Saved on device</span></div>${hero()}${allBlocked?`<div class="notice warn"><strong>You have ${points()} unspent point${points()===1?'':'s'}, but your queued upgrades aren't ready yet.</strong> Check the challenge boxes below, satisfy tier requirements, or choose an available skill in the <button class="textbtn" data-goto="skills">Skill library →</button>. Your points are not lost.</div>`:''}<div class="grid2"><div class="stack"><section class="panel"><div class="row" style="margin-bottom:10px"><h3 style="margin:0">Next upgrades</h3><button class="textbtn" data-goto="roadmap">Full roadmap →</button></div>${sim.length?sim.slice(0,5).map(p=>roadCard(p)).join(''):'<div class="empty">Queue is empty. Add upgrades from the skill library.</div>'}<div style="margin-top:14px"><button class="btn secondary" data-goto="skills">+ Browse 82 skills</button></div></section><section class="panel"><h3>Captain's guide</h3><ul class="tips"><li>To buy Rank 2–4, complete its in-game challenge and check the box right on the roadmap. Locked Learn buttons now explain why.</li><li>UC Vanguard simulator is useful for Piloting challenges.</li><li>Security 3 unlocks Master locks. Piloting 4 unlocks Class C ships.</li><li>Higher tiers require 4 / 8 / 12 ranks in the same category.</li></ul></section></div><div class="stack"><section class="panel"><h3>Skill investments</h3>${categoryProgress()}<p class="footnote">Includes your three free Bounty Hunter starting ranks.</p></section><section class="panel"><h3>Milestones</h3>${milestones()}</section></div></div>`}
function roadmap(){const sim=planSimulation();const invalid=sim.filter(p=>p.missing||p.maxed);return `<div class="headrow"><div><span class="eyebrow">Flight plan / 02</span><h2>Level-by-level roadmap</h2><p class="sub">Reorder planned upgrades without spending points.</p></div><button class="btn secondary" data-goto="skills">+ Add skill</button></div>${hero()}<div class="panel"><div class="row" style="flex-wrap:wrap;margin-bottom:12px"><div class="kicker"><span class="cap">Suggested route</span><select class="select" aria-label="Roadmap preset" id="presetSelect">${Object.keys(presets).map(k=>`<option value="${esc(k)}" ${state.preset===k?'selected':''}>${esc(k)}</option>`).join('')}<option value="Custom" ${state.preset==='Custom'?'selected':''}>Custom roadmap</option></select></div><button class="smallbtn" data-act="applypreset" ${state.preset==='Custom'?'disabled':''}>Load preset</button></div><p class="footnote">Loading a preset replaces only your future roadmap, not purchased skills. Levels shown are estimates assuming you earn one point per level; challenges can delay unlocks. A locked Learn button remains tappable and explains the requirement.</p>${invalid.length?`<div class="notice warn">${invalid.length} planned step${invalid.length===1?'':'s'} currently violate a tier gate or max rank. Use the arrow buttons to fix the order.</div>`:''}${sim.length?sim.map(p=>roadCard(p,true)).join(''):'<div class="empty">Your next chapter is unwritten. Add some skills.</div>'}<div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn primary" data-goto="skills">+ Add another upgrade</button><button class="btn secondary" data-act="copyplan">Copy plan as text</button></div></div>`}
function skillCard(s){const r=current(s.id),gap=tierGap(s),status=canBuy(s.id),q=state.plan.filter(x=>x===s.id).length,next=r+q+1;return `<article class="skill"><header><div><div class="duo" style="margin-bottom:7px">${categoryBadge(s.cat)}<span class="chip">Tier ${s.tier}</span></div><h4>${esc(s.id)}</h4></div><span class="rankno">${r} / 4</span></header><p>${esc(s.desc)}</p><div class="rankbar" aria-label="${r} of 4 ranks learned">${[1,2,3,4].map(i=>`<i class="${i<=r?'on':''}"></i>`).join('')}</div>${r&&r<4?`<div style="font-size:12px"><strong style="color:#dae8ee">Next rank ${r+1}:</strong> ${esc(benefitText(s.id,r+1))}</div><label class="checkboxline"><input type="checkbox" data-challenge="${esc(s.id)}" ${state.ready[s.id]?'checked':''}><span>Challenge complete: ${esc(challengeText(s.id,r))}</span></label>`:r===0?`<div style="font-size:12px;color:#a9c1cf">Rank 1: ${esc(benefitText(s.id,1))}</div>`:'<div style="font-size:12px;color:var(--cyan)">✓ Mastered: Rank 4</div>'}${gap&&r<4?`<div class="locktext">◈ ${gap} more ${s.cat} rank${gap===1?'':'s'} needed for Tier ${s.tier}</div>`:''}${!status.ok&&r<4?`<div class="action-status">🔒 ${esc(status.why)}</div>`:r<4?`<div class="action-status ready">✓ Ready to learn</div>`:''}<div class="skillfoot"><div class="duo"><button class="smallbtn" data-act="add" data-id="${esc(s.id)}" ${next>4?'disabled':''}>+ Plan ${next<=4?`R${next}`:''}</button><button class="smallbtn ${status.ok?'primary':'blocked-action'}" data-act="buy" data-id="${esc(s.id)}" ${r>=4?'disabled':''} title="${esc(status.why||'Learn next rank')}">${r>=4?'Maxed':`Learn R${r+1}`}</button></div>${r>(starters.includes(s.id)?1:0)?`<button class="ghost" title="Undo latest purchased rank" aria-label="Undo last purchased rank" data-act="undo" data-id="${esc(s.id)}">↶</button>`:''}</div></article>`}
function skillLibrary(){const chosen=skills.filter(s=>(filterCat==='All'||s.cat===filterCat)&&(filterTier==='All'||s.tier===Number(filterTier))&&(!showOwned||current(s.id)>0)&&(`${s.id} ${s.desc}`.toLowerCase().includes(filterQuery.toLowerCase())));return `<div class="headrow"><div><span class="eyebrow">Star chart / 03</span><h2>Explore the skill tree</h2><p class="sub">All 82 skills · Four ranks each · Five categories</p></div><div class="pill">${chosen.length} shown</div></div><div class="notice">Skill points and tier gates are enforced when you learn a skill. Add any rank to your future plan, including currently locked skills. Check off an in-game challenge here or directly in the roadmap when it is completed. If Learn is locked, tap it to see why.</div><div class="toolbar"><input class="search" id="skillSearch" aria-label="Search skills" placeholder="Search skills or effects…" value="${esc(filterQuery)}"><select class="select" id="skillCategory" aria-label="Skill category"><option>All</option>${categories.map(cat=>`<option value="${cat}" ${filterCat===cat?'selected':''}>${cat}</option>`).join('')}</select><select class="select" id="skillTier" aria-label="Skill tier"><option value="All">All tiers</option>${[1,2,3,4].map(n=>`<option value="${n}" ${String(filterTier)===String(n)?'selected':''}>Tier ${n}</option>`).join('')}</select><label class="checkboxline" style="align-items:center"><input type="checkbox" id="ownedOnly" ${showOwned?'checked':''}>Owned only</label></div><div class="skillsgrid">${chosen.length?chosen.map(skillCard).join(''):'<div class="panel empty">No skills match those filters.</div>'}</div>`}
function character(){return `<div class="headrow"><div><span class="eyebrow">Personal dossier / 04</span><h2>Character & backup</h2><p class="sub">Your progress is stored only on this device, in this browser.</p></div></div><div class="grid2"><div class="stack"><section class="panel"><h3>Character profile</h3><div class="formgrid"><div class="field"><label for="charName">Captain name</label><input id="charName" value="${esc(state.name)}" maxlength="70"></div><div class="field"><label for="charLevel">Current level</label><input id="charLevel" type="number" min="${spent()+1}" max="999" value="${state.level}"></div></div><div class="divider"></div><div class="cap">Background</div><h3 style="margin:6px 0">Bounty Hunter</h3><p class="sub">Free starting ranks: Piloting 1, Targeting Control Systems 1, Boost Pack Training 1.</p><div class="divider"></div><div class="cap">Traits</div><div class="duo" style="margin:10px 0 15px">${state.traits.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><div class="formgrid">${[0,1,2].map(i=>`<div class="field"><label for="trait${i}">Trait ${i+1}</label><input id="trait${i}" value="${esc(state.traits[i]||'')}" maxlength="45"></div>`).join('')}</div><div style="margin-top:15px"><button class="btn primary" data-act="profileSave">Save profile</button></div></section><section class="panel"><h3>Notes from the Settled Systems</h3><div class="field"><textarea id="charNotes" rows="6" placeholder="Ship build ideas, factions, equipment and next mission…">${esc(state.notes)}</textarea></div><div style="margin-top:12px"><button class="btn secondary" data-act="notesSave">Save notes</button></div></section></div><div class="stack"><section class="panel"><h3>Save & transfer</h3><p class="sub" style="margin-bottom:16px">Progress saves automatically in this browser. To move phones, switch browsers or keep a backup, download a JSON file.</p><div class="duo"><button class="btn primary" data-act="export">↓ Export save</button><button class="btn secondary" data-act="import">↑ Import save</button></div><div class="divider"></div><button class="btn danger" data-act="reset">Reset to new Bounty Hunter</button><p class="footnote">Reset clears purchased skills and reloads the recommended roadmap. Import replaces all saved progress.</p></section><section class="panel"><h3>How this planner calculates</h3><ul class="tips"><li>Level 1 begins with three free Bounty Hunter skill ranks.</li><li>Every level after 1 grants one point.</li><li>Tech starts with 3 ranks thanks to your background.</li><li>New tiers open at 4 / 8 / 12 ranks in that category.</li><li>Rank 2–4 purchases require your challenge-complete checkbox.</li><li>Planned upgrades are not purchases. The roadmap estimates their levels using unspent points and queue order.</li></ul></section></div></div>`}
function render(){document.getElementById('view').innerHTML=page==='overview'?overview():page==='roadmap'?roadmap():page==='skills'?skillLibrary():character()}
function changeLevel(n){const minimum=spent()+1;if(n<minimum){toast(`Cannot go below level ${minimum} with your purchased skill ranks.`,true);return}state.level=Math.max(minimum,Math.min(999,Math.floor(n)||minimum));persist();render()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='starfield-orbit-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Save exported as JSON')}
function swap(i,j){if(j<0||j>=state.plan.length)return;[state.plan[i],state.plan[j]]=[state.plan[j],state.plan[i]];state.preset='Custom';persist();render()}
function summarize(){const sim=planSimulation();return `STARFIELD // ${state.name}\nBackground: Bounty Hunter\nLevel ${state.level} | Available points ${points()}\nTraits: ${state.traits.join(', ')}\n\nFUTURE SKILLS\n${sim.map((p)=>`Level ${p.level}: ${p.id} Rank ${p.rank}${p.missing?' [tier locked]':''}`).join('\n')}\n`}
function copyPlan(){const value=summarize();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(()=>toast('Roadmap copied')).catch(()=>window.prompt('Copy your roadmap:',value))}else window.prompt('Copy your roadmap:',value)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}const go=e.target.closest('[data-goto]');if(go){setPage(go.dataset.goto);return}const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,idx=Number(b.dataset.index);switch(a){case'levelup':changeLevel(state.level+1);break;case'leveldown':changeLevel(state.level-1);break;case'buy':if(b.dataset.targetRank&&current(id)+1!==Number(b.dataset.targetRank)){toast(`Learn ${id} Rank ${current(id)+1} first. This is a later planned upgrade.`,true);break}buy(id);break;case'undo':undo(id);break;case'add':add(id);break;case'remove':state.plan.splice(idx,1);state.preset='Custom';persist();render();break;case'moveup':swap(idx,idx-1);break;case'movedown':swap(idx,idx+1);break;case'applypreset':{if(!window.confirm('Replace your planned upgrades with the selected preset? Purchased skills will remain unchanged.'))return;const key=document.getElementById('presetSelect').value;let virtual={...state.ranks};state.plan=presets[key].filter(id=>{if((virtual[id]||0)>=4)return false;virtual[id]=(virtual[id]||0)+1;return true});state.preset=key;persist();render();toast('Roadmap replaced');break}case'copyplan':copyPlan();break;case'profileSave':state.name=(document.getElementById('charName').value.trim()||'The Bounty Hunter').slice(0,70);state.traits=[0,1,2].map(i=>document.getElementById('trait'+i).value.trim()).filter(Boolean);state.level=Math.max(spent()+1,Math.min(999,Number(document.getElementById('charLevel').value)||state.level));persist();render();toast('Character saved');break;case'notesSave':state.notes=document.getElementById('charNotes').value.slice(0,4000);persist();toast('Notes saved');break;case'export':exportData();break;case'import':document.getElementById('importFile').click();break;case'reset':if(window.confirm('Reset ALL progress, notes and roadmap to the default Bounty Hunter build?')){state=fresh();persist();render();toast('New Bounty Hunter created')}break}});
document.addEventListener('change',e=>{if(e.target.matches('[data-challenge]')){state.ready[e.target.dataset.challenge]=e.target.checked;persist();render()}if(e.target.id==='skillCategory'){filterCat=e.target.value;render()}if(e.target.id==='skillTier'){filterTier=e.target.value;render()}if(e.target.id==='ownedOnly'){showOwned=e.target.checked;render()}if(e.target.id==='presetSelect'){state.preset=e.target.value;persist();render()}});
document.addEventListener('input',e=>{if(e.target.id==='skillSearch'){filterQuery=e.target.value;const selection=e.target.selectionStart;render();const field=document.getElementById('skillSearch');field.focus();field.setSelectionRange(selection,selection)}});
document.getElementById('importFile').addEventListener('change',async(e)=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||typeof obj!=='object'||!obj.ranks||!Array.isArray(obj.plan))throw Error('Invalid file structure');if(!window.confirm('Replace your current save with this imported character?'))return;state=sanitize(obj);persist();render();toast('Character imported successfully')}catch(err){toast('Could not import: file is not a valid ORBIT save',true)}finally{e.target.value=''}});
render();if(skills.length!==82)console.warn('Expected 82 skills; got '+skills.length);
})();
</script></body></html>
